
name: TP1 CI Pipeline

on:
  push:
    branches:
      - main
      - ajout-fonctionnalites
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare project
        run: echo "Preparation du projet"

  test:
    name: Test and validate files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify TP1.txt
        run: test -s TP1.txt

      - name: Validate feature files
        run: |
          if [ -s fonctionnalite1.txt ] && [ -s fonctionnalite2.txt ]; then
            echo "Tous les fichiers sont presents et non vides"
          else
            echo "Un ou plusieurs fichiers sont manquants ou vides"
            exit 1
          fi

  deploy:
    name: Deployment simulation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Simulate deployment
        run: echo "Simulation du deploiement"
